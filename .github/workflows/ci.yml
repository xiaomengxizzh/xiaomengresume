name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_project_dependencies:
        description: 'Owner explicitly approves dependency downloads for this run (existing Electron/Node toolchain)'
        type: boolean
        required: true
        default: false

jobs:
  resource-policy:
    name: No-install resource policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q '下载前' file/项目规范.md
          grep -q '本地' AGENTS.md
          echo 'Owner approval and dependency reuse rules found; no packages installed by this check'

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'xiaomengxizzh' && inputs.approve_project_dependencies == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Preflight existing dependencies and pnpm cache before any install
        run: |
          echo 'Existing pnpm store:'
          pnpm store path
          if [ -d node_modules ] && pnpm list --depth 0 >/dev/null 2>&1; then
            echo 'Reusing existing compatible dependency tree; no pnpm install'
          else
            echo 'Local node_modules missing/incompatible; owner-approved setup uses existing pnpm cache first'
            pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
